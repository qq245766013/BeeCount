name: Simple APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
      - run: flutter pub get
      - run: flutter build apk --release --flavor prod
      - name: Find APK
        if: always()
        run: find /home/runner/work -name "*.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bee-count-debug-apk
          path: "**/*.apk"
